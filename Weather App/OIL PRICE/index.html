<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Oil Price Tracker</title>

  <style>

    body{
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      padding: 40px;
    }

    .card{
      background: #222;
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      margin: auto;
    }

    h1{
      color: orange;
    }

    p{
      font-size: 20px;
    }

  </style>
</head>
<body>

  <div class="card">

    <h1>Oil & Fuel Price Tracker</h1>

    <p id="oilPrice">Loading oil price...</p>

    <p id="fuelPrice">
      Average Nigeria Fuel Price: ₦1200/L
    </p>

    <p id="comparison"></p>

  </div>

  <script>

    async function getOilPrice() {

      try {

        // Example API
        const response = await fetch(
          "https://api.sampleapis.com/futurama/info"
        );

        // fake data because free oil APIs may require keys
        const oilPrice = 102;

        document.getElementById("oilPrice").innerText =
          `Current Oil Price: $${oilPrice} per barrel`;

        // 1 barrel = 159 litres
        const pricePerLiter = oilPrice / 159;

        document.getElementById("comparison").innerText =
          `Crude oil costs about $${pricePerLiter.toFixed(2)}
          per litre before refining, transport, taxes, and profit.
          Petrol in Nigeria currently sells around ₦1200 per litre.`;

      } catch(error) {

        console.log(error);

      }

    }

    getOilPrice();

  </script>

</body>
</html>
