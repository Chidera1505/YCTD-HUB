<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="cal.js"></script>
</head>
<body>
   <h1 >Mini calculator</h1>
   <p>Addition - Subtraction - Multiplication - Division</p>

   <h3>Enter first number</h3>
   <input type="number" id="number1" placeholder="0">

   <h3>Enter second number</h3>
   <input type="number" id="number2" placeholder="0">

<br>
    <button onclick="add()">Add</button>
    <button  onclick="subtract()">Subtract</button>
    <button  onclick="multiply()">Multiply</button>
    <button  onclick="divide()">Divide</button>

    <h3 id="answer">Answer here</h3>
</body>
</html>
